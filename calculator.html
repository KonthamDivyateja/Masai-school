<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masai Calculator</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .calculator-container {
            padding: 20px;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .calculator-grid {
            width: 300px;
            display: grid;
            grid-template-rows: 60px 1fr;
            gap: 10px;
        }

        .display {
            background-color: #333;
            color: white;
            font-size: 2em;
            padding: 10px;
            text-align: right;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: bold;
        }

        .number {
            background-color: #ccc;
        }

        .clear {
            background-color: #FF5722;
            color: white;
        }

        .operator {
            background-color: #000;
            color: white;
        }
        
        /* Coloring the number buttons and operators as per the visual layout */
        .number {
            background-color: #fff;
        }

        .operator.plus {
            background-color: #4CAF50; 
            grid-row: 1; 
            grid-column: 4;
        }
        .operator.minus {
            background-color: #000;
            grid-row: 2; 
            grid-column: 4;
        }
        .operator.multiply {
            background-color: #000;
            grid-row: 3; 
            grid-column: 4;
        }
        .operator.divide {
            background-color: #000;
            grid-row: 4;
            grid-column: 3;
        }
        .operator.equals {
            background-color: #000;
            grid-row: 4;
            grid-column: 4;
        }

        /* Adjustments for the bottom row */
        .zero {
            grid-row: 4;
            grid-column: 2;
            background-color: #000;
            color: white;
        }
        .clear {
            grid-row: 4;
            grid-column: 1;
            background-color: #FF5722;
            color: white;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <h1>Masai Calculator</h1>
        <div class="calculator-grid">
            <div class="display">0</div>
            
            <div class="buttons-grid">
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="operator plus">+</button>
                
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="operator minus">-</button>
                
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="operator multiply">×</button>
                
                <button class="clear">C</button>
                <button class="number zero">0</button>
                <button class="operator divide">÷</button>
                <button class="operator equals">=</button>
            </div>
        </div>
    </div>
</body>
</html>
