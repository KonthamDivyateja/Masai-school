<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <style>
        .container {
            width: 500px;
            height: 600px;
            padding: 30px;
            margin: 10px auto;
            border: 3px solid grey;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box; 
            text-align: center;
        }

        .product-image {
            width: 100%;
            max-height: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 1.5em;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: #333;
        }

        p {
            margin: 0 0 25px 0;
            color: #666;
            font-size: 1em;
        }

        .buy-button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }

        .buy-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="product-image" src="https://via.placeholder.com/500x300?text=Product+Image" alt="Product Image">
        <h3>SAMSUNG Galaxy Watch6 LTE</h3>
        <p>Graphite Strap, 44mm. 54% off!</p>
        <button class="buy-button">Buy Now</button>
    </div>
</body>
</html>
